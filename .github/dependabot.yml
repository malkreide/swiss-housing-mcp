# Dependabot — monatliche Update-PRs.
#
# In diesem Repo lief bisher gar kein Dependabot: die Datei fehlte. Ein
# fehlender Scheduler meldet sich nicht, deshalb ist das nie aufgefallen.
#
# Bewusst OHNE `labels:` — und zwar dauerhaft, nicht nur mangels Label.
#
# Ohne den Schlüssel bekommt jeder PR per Vorgabe ein `dependencies`-Label, bei
# mehreren Paketmanagern zusätzlich eines fürs Ökosystem, und Dependabot legt
# beide bei Bedarf selbst an. Eine eigene Liste ERSETZT diesen Vorgabesatz, und
# Namen, die das Repo nicht kennt, werden ignoriert — quittiert mit einem
# Kommentar an jedem PR, ohne roten Check.
#
# Die Zeile nachzuziehen wäre also auch dann ein Rückschritt, wenn das Label
# existiert: Sie tauscht einen sich selbst pflegenden Vorgabesatz gegen eine
# Aufzählung, die jemand von Hand synchron halten müsste. Das stand hier vorher
# andersherum.
version: 2
updates:

  # Python-Abhängigkeiten aus pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]

  # Gepinnte Action-Versionen in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
