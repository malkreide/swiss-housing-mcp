name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # Triggered on every tag like v0.2.0, v1.0.0 etc.
  workflow_dispatch:  # Allows manual dispatch (e.g. when no tag can be pushed).
                      # skip-existing guards against double uploads.

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/swiss-housing-mcp

    permissions:
      id-token: write   # Required for Trusted Publisher (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install hatch

      - name: Build package
        run: hatch build

      - name: Release-Gate auf den gebauten Artefakten
        run: |
          # Prueft das Wheel, nicht die Quellen: Der mcp-name-Marker muss in der
          # METADATA stehen, und `server.json` description > 100 Zeichen laesst
          # die Registry mit 422 abbrechen — beides faellt sonst erst NACH dem
          # PyPI-Upload auf, und der ist unveraenderlich.
          #
          # --tag nur auf einem Tag-Lauf: Bei workflow_dispatch von einem Branch
          # ist GITHUB_REF_NAME der Branchname, und die A4-Pruefung «Tag ==
          # gebaute Version» wuerde dann gegen "main" vergleichen und falsch rot.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python3 scripts/check_release_artifacts.py --dist dist --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check_release_artifacts.py --dist dist
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # No 'with: password:' needed — Trusted Publisher handles auth.
        with:
          # Does not fail if a version already exists on PyPI (PyPI is
          # immutable; a re-upload of the same version would otherwise fail
          # with "400 File already exists").
          skip-existing: true

  publish-mcp:
    name: Publish to MCP Registry
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for MCP Registry Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync server.json version to the release version
        run: |
          # On a tag run (v1.2.3) derive the version from the tag. On a manual
          # workflow_dispatch from a branch, GITHUB_REF_NAME is the branch name
          # (e.g. "main"), so stripping "v" would write the branch name into
          # server.json and desync the MCP-registry version from the PyPI
          # artifact. Fall back to the version already committed in server.json.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r '.version' server.json)"
          fi
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
