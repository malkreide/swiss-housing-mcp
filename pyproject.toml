[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swiss-housing-mcp"
version = "0.1.0"
description = "MCP server for the Swiss Federal Register of Buildings and Dwellings (GWR/RegBL) — buildings, dwellings, construction pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "malkreide" }]
keywords = ["mcp", "model-context-protocol", "llm", "swiss-open-data", "gwr", "regbl", "housing", "buildings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "mcp[cli]>=1.2.0,<2.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
swiss-housing-mcp = "swiss_housing_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/malkreide/swiss-housing-mcp"
Repository = "https://github.com/malkreide/swiss-housing-mcp"
Changelog = "https://github.com/malkreide/swiss-housing-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/malkreide/swiss-housing-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/swiss_housing_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests against real upstream services (excluded from CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
